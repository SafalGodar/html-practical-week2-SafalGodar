<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
</head>
<body>
    <header>
        <h1>My Favorite Websites</h1>
    </header>

    <main>
        <section>
            <h2>Links</h2>
            <ul>
                <li><a href="https://www.google.com/" target="_blank">google</a><br></li>
                <li><a href="https://www.youtube.com/" target="_blank">YouTube</a><br></li>
                <li><a href="https://www.wikipedia.org/" target="_blank">Wikipedia</a><br></li>
                <li><a href="https://www.w3schools.com/" target="_blank">W3Schools</a><br></li>
            </ul>
        </section>

        <section>
            <h2>Images</h2>
            <article>
                <img src="download.jpg" alt="Description of local image">
                <p>This is a local image.</p>
            </article>
            <article>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN5AbjO1WSe4_USTs7hv54x36VhuWLXcYYWenxaJQlBQ&s" alt="Description of external image">
                <p>This is an external image.</p>
            </article>
        </section>
    </main>

    <footer>
        <p> 2026 My Favorite Websites</p>
    </footer>
</body>
</html>
