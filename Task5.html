<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Weekly Class Timetable</h1>
    <table border="1">
        <tr>
            <th>Time</th>
            <th>Sunday</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>
        <tr>
            <td>10:00 - 12:00</td>
            <td>FSE</td>
            <td>MCCT</td>
            <td>Practical</td>
            <td>library</td>
            <td>FSE</td>
            <td>MCCT</td>
        </tr>
        <tr>
            <td>12:00 - 1:00</td>
            <td colspan="6">Lunch Break</td>
        </tr>
        <tr>
            <td>1:00 - 3:00</td>
            <td>Coding</td>
            <td>practical</td>
            <td>Coding</td>
            <td>library</td>
            <td>Coding</td>
            <td>practical</td>
        </tr>
    </table>
</body>
</html>
