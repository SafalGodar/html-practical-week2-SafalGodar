<!-- Embedding Content
• Create task8.html titled &#39;My Media Hub&#39;.
• Embed a YouTube video using &lt;iframe&gt;.
• Embed a local video with the &lt;video&gt; tag, controls, and at least 2 &lt;source&gt; fallback formats.
• Embed an audio clip using the &lt;audio&gt; tag with controls.
• Embed a Google Map location (e.g., PCPS College, Kupondole) using an &lt;iframe&gt;.
• Embed an external webpage inside your page using &lt;iframe&gt;.
• Embed a PDF document using &lt;embed&gt; or &lt;object&gt;.
• Link a Google Font in &lt;head&gt; and apply it to your main heading.
• Add a favicon using &lt;link rel=&quot;icon&quot;&gt;.
Learning outcome: Students learn to embed multimedia and external resources, and apply typography and
branding. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=m">
    <title>My media hub</title>
</head>
<body>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <video width="320" height="240" controls>
        <source src="movie.mp4" type="video/mp4">
        <source src="movie.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        <source src="audio.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.1234567890123!2d85.32456789012345!3d27.67890123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb190123456789%3A0xabcdef1234567890!2sPCPS%20College%2C%20Kupondole%2C%20Lalitpur%20144600%2C%20Nepal!5e0!3m2!1sen!2sus!4v1612345678901" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    <iframe src="https://www.example.com" width="600" height="400" title="External Webpage"></iframe>
    <embed src="document.pdf" type="application/pdf" width="600" height="400">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</body>
</html>
